[package]
name = "oxideav-ac4"
version = "0.0.7"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-ac4"
authors = ["Mark Karpeles"]
description = "Pure-Rust Dolby AC-4 audio decoder foundation for oxideav — sync, TOC, presentation and substream parsing"

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-ac4"
keywords = ["multimedia", "audio", "ac4", "dolby", "pure-rust"]
categories = ["multimedia::encoding", "multimedia::audio"]

[dependencies]
oxideav-core = "0.1"
# Temporary speed shortcut for the IMDCT's inner complex transform,
# replacing an O(N^2) direct-form sum (see src/mdct.rs). Every other
# oxideav-* codec crate is dependency-free by design ("pure Rust, no C
# deps"), so this is flagged as a decision to revisit with upstream
# (OxideAV/oxideav-ac4) rather than a settled choice — a hand-rolled
# mixed-radix FFT would match the project's convention but is real DSP
# work; rustfft (itself pure Rust, no unsafe C deps) gets real playback
# speed now.
rustfft = "6.4"
